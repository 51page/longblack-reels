<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>롱블랙 클립</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root { --black:#0A0A0A; --gold:#C8A96E; --border:rgba(255,255,255,0.09); }
body {
  background:#0D0D0D; display:flex; justify-content:center; align-items:center;
  min-height:100vh; font-family:'Apple SD Gothic Neo','Noto Sans KR',-apple-system,sans-serif;
}
.phone {
  position:relative; width:390px; height:844px; background:var(--black);
  border-radius:54px; overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,255,255,.11),0 50px 140px rgba(0,0,0,.85);
  flex-shrink:0;
}
.dynamic-island {
  position:absolute; top:12px; left:50%; transform:translateX(-50%);
  width:126px; height:36px; background:#000; border-radius:20px; z-index:300;
}
.scroll-wrap {
  position:absolute; inset:0; overflow-y:scroll;
  scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.scroll-wrap::-webkit-scrollbar { display:none; }
.clip-slide {
  width:100%; height:100%; scroll-snap-align:start;
  position:relative; overflow:hidden; background:#111; flex-shrink:0;
}
.clip-bg {
  position:absolute; inset:0; background-size:cover;
  background-position:center; background-repeat:no-repeat;
}
.clip-slide[data-format="image"] .clip-bg::after,
.clip-slide[data-format="quote"] .clip-bg::after,
.clip-slide[data-format="stat"]  .clip-bg::after,
.clip-slide[data-format="memory"] .clip-bg::after,
.clip-slide[data-format="unread"] .clip-bg::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.38) 0%,rgba(0,0,0,.02) 28%,rgba(0,0,0,.02) 50%,rgba(0,0,0,.55) 68%,rgba(0,0,0,.91) 100%);
}
.clip-slide[data-format="card"] .clip-bg { height:56%; }
.clip-slide[data-format="card"] .clip-bg::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.12),rgba(0,0,0,.48));
}
.clip-slide[data-format="banner"] .clip-bg::after,
.clip-slide[data-format="comment"] .clip-bg::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.0) 0%,rgba(0,0,0,.0) 40%,rgba(0,0,0,.82) 100%);
}
.clip-icon {
  position:absolute; inset:0; display:flex; align-items:center;
  justify-content:center; font-size:52px; z-index:1; pointer-events:none;
}
.s-actions {
  position:absolute; right:14px; bottom:200px; z-index:10;
  display:flex; flex-direction:column; align-items:center; gap:18px;
}
.clip-slide[data-format="card"]    .s-actions { bottom:auto; top:120px; }
.clip-slide[data-format="banner"]  .s-actions { bottom:auto; top:160px; }
.clip-slide[data-format="comment"] .s-actions { bottom:auto; top:160px; }
.action-item {
  display:flex; flex-direction:column; align-items:center;
  gap:4px; cursor:pointer; user-select:none;
}
.action-circle {
  width:42px; height:42px; border-radius:50%;
  background:rgba(255,255,255,.09); backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.11);
  display:flex; align-items:center; justify-content:center; transition:all .2s;
}
.action-circle:active { transform:scale(.88); }
.action-label { font-size:10.5px; color:rgba(255,255,255,.6); font-weight:500; }
.badge {
  display:inline-flex; align-items:center; padding:2px 9px; border-radius:20px;
  font-size:10.5px; font-weight:700; letter-spacing:.07em;
}
.badge-B,.badge-L { background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.17); }
.badge-K,.badge-N { background:rgba(200,169,110,.14); color:var(--gold); border:1px solid rgba(200,169,110,.26); }
.badge-C { background:rgba(130,180,255,.1); color:#a8c8ff; border:1px solid rgba(130,180,255,.22); }
.read-btn {
  flex:1; height:44px; background:#fff; border-radius:11px; border:none;
  cursor:pointer; font-size:13.5px; font-weight:700; color:#0A0A0A;
  font-family:inherit; display:flex; align-items:center; justify-content:center;
  gap:5px; letter-spacing:-.01em; transition:opacity .15s;
}
.read-btn:active { opacity:.8; }
.rating-chip {
  display:flex; align-items:center; gap:4px; padding:0 12px; height:44px;
  border-radius:11px; background:rgba(255,255,255,.07); border:1px solid var(--border);
  font-size:13px; color:#fff; font-weight:600; white-space:nowrap;
}
.star { color:var(--gold); font-size:12px; }
.bottom-cta { display:flex; gap:8px; align-items:center; }
.clip-meta { display:flex; align-items:center; gap:8px; margin-bottom:7px; }
.clip-author { font-size:11.5px; color:rgba(255,255,255,.48); }

/* ── FORMAT 1: IMAGE ── */
.s-bottom-image { position:absolute; bottom:0; left:0; right:0; z-index:10; padding:0 72px 36px 18px; }
.clip-title { font-size:18px; font-weight:700; color:#fff; line-height:1.42; letter-spacing:-.025em; margin-bottom:10px; }
.clip-insight {
  border-left:2px solid var(--gold); padding:8px 12px; margin-bottom:14px;
  background:rgba(255,255,255,.045); border-radius:0 7px 7px 0; backdrop-filter:blur(4px);
}
.insight-label { font-size:9.5px; color:var(--gold); font-weight:700; letter-spacing:.11em; text-transform:uppercase; margin-bottom:4px; }
.insight-text { font-size:12.5px; color:rgba(255,255,255,.78); line-height:1.65; letter-spacing:-.01em; }

/* ── FORMAT 2: QUOTE ── */
.quote-center {
  position:absolute; top:50%; left:0; right:0; transform:translateY(-58%);
  padding:0 30px; text-align:center; z-index:10;
}
.quote-mark { font-size:80px; line-height:.7; color:var(--gold); opacity:.7; font-family:Georgia,serif; margin-bottom:12px; display:block; }
.quote-text { font-size:20px; font-weight:400; color:#fff; line-height:1.7; letter-spacing:-.02em; word-break:keep-all; }
.quote-attr { margin-top:20px; font-size:12.5px; color:var(--gold); font-weight:600; letter-spacing:.04em; }
.s-bottom-quote { position:absolute; bottom:0; left:0; right:0; z-index:10; padding:0 72px 36px 18px; }

/* ── FORMAT 3: CARD ── */
.card-panel {
  position:absolute; bottom:0; left:0; right:0; height:47%;
  background:var(--black); z-index:10;
  padding:20px 72px 0 18px; display:flex; flex-direction:column;
}
.card-title { font-size:22px; font-weight:800; color:#fff; line-height:1.32; letter-spacing:-.03em; margin:8px 0 10px; flex:1; }
.card-sub { font-size:13px; color:rgba(255,255,255,.5); line-height:1.6; letter-spacing:-.01em; margin-bottom:14px; }
.card-cta { padding:0 0 36px; }

/* ── FORMAT 4: STAT ── */
.stat-center {
  position:absolute; top:50%; left:0; right:0; transform:translateY(-54%);
  padding:0 28px; text-align:center; z-index:10;
}
.stat-ctx { font-size:10.5px; color:var(--gold); font-weight:700; letter-spacing:.15em; text-transform:uppercase; margin-bottom:14px; }
.stat-row { display:flex; align-items:flex-end; justify-content:center; gap:4px; }
.stat-number { font-size:92px; font-weight:800; color:#fff; line-height:1; letter-spacing:-.04em; }
.stat-unit { font-size:36px; font-weight:700; color:rgba(255,255,255,.55); line-height:1; padding-bottom:8px; }
.stat-desc { margin-top:18px; font-size:14.5px; color:rgba(255,255,255,.62); line-height:1.65; letter-spacing:-.015em; word-break:keep-all; }
.s-bottom-stat { position:absolute; bottom:0; left:0; right:0; z-index:10; padding:0 72px 36px 18px; }

/* ── FORMAT 5: BANNER ── */
.banner-tag {
  position:absolute; top:68px; left:18px; z-index:10;
  font-size:9.5px; font-weight:800; letter-spacing:.18em; text-transform:uppercase;
  color:var(--gold); background:rgba(200,169,110,.12);
  border:1px solid rgba(200,169,110,.3); padding:3px 10px; border-radius:6px;
}
.banner-placeholder {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:10px; z-index:2;
}
.banner-ph-icon { font-size:40px; opacity:.3; }
.banner-ph-text { font-size:13px; color:rgba(255,255,255,.25); letter-spacing:.02em; }
.s-bottom-banner { position:absolute; bottom:0; left:0; right:0; z-index:10; padding:0 72px 36px 18px; }
.banner-caption { font-size:22px; font-weight:800; color:#fff; letter-spacing:-.03em; line-height:1.3; margin-bottom:14px; }
.banner-cta {
  width:100%; height:46px; background:var(--gold); border-radius:11px; border:none;
  cursor:pointer; font-size:14px; font-weight:700; color:#0A0A0A;
  font-family:inherit; display:flex; align-items:center; justify-content:center;
  gap:6px; letter-spacing:-.01em; transition:opacity .15s;
}
.banner-cta:active { opacity:.85; }

/* ── FORMAT 6: MEMORY (1년 전 오늘) ── */
.memory-top-badge {
  position:absolute; top:68px; left:18px; z-index:10;
  display:inline-flex; align-items:center; gap:5px;
  font-size:11px; font-weight:700; letter-spacing:.04em; color:#fff;
  background:rgba(200,169,110,.85); padding:5px 13px; border-radius:20px;
}
.memory-date-sub {
  position:absolute; top:108px; left:20px; z-index:10;
  font-size:11px; color:rgba(255,255,255,.45); font-weight:500; letter-spacing:.01em;
}
.s-bottom-memory { position:absolute; bottom:0; left:0; right:0; z-index:10; padding:0 72px 36px 18px; }
.memory-title { font-size:18px; font-weight:700; color:#fff; line-height:1.42; letter-spacing:-.025em; margin-bottom:10px; }
.memory-btn {
  width:100%; height:44px; background:rgba(200,169,110,.15); border-radius:11px;
  border:1px solid rgba(200,169,110,.38); cursor:pointer; font-size:13.5px; font-weight:700;
  color:var(--gold); font-family:inherit; display:flex; align-items:center; justify-content:center;
  gap:5px; letter-spacing:-.01em; transition:opacity .15s;
}
.memory-btn:active { opacity:.8; }

/* ── FORMAT 7: COMMENT (추천 댓글) ── */
.comment-center {
  position:absolute; top:50%; left:0; right:0; transform:translateY(-60%);
  padding:0 28px; text-align:center; z-index:10;
}
.comment-qmark { font-size:72px; line-height:.7; color:rgba(200,169,110,.55); font-family:Georgia,serif; margin-bottom:14px; display:block; }
.comment-text { font-size:17px; font-weight:400; color:#fff; line-height:1.75; letter-spacing:-.02em; word-break:keep-all; margin-bottom:22px; }
.comment-user-row { display:flex; align-items:center; justify-content:center; gap:10px; }
.comment-avatar {
  width:34px; height:34px; border-radius:50%;
  background:rgba(200,169,110,.22); border:1.5px solid rgba(200,169,110,.38);
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700; color:var(--gold); flex-shrink:0;
}
.comment-user-info { text-align:left; }
.comment-username { font-size:12px; font-weight:600; color:rgba(255,255,255,.82); }
.comment-likes-count { font-size:10.5px; color:rgba(255,255,255,.38); margin-top:2px; }
.s-bottom-comment { position:absolute; bottom:0; left:0; right:0; z-index:10; padding:0 72px 36px 18px; }
.comment-from-lbl { font-size:9px; font-weight:700; color:var(--gold); letter-spacing:.12em; text-transform:uppercase; margin-bottom:5px; }
.comment-note-ref { font-size:13px; font-weight:600; color:rgba(255,255,255,.65); line-height:1.4; letter-spacing:-.01em; margin-bottom:13px; }

/* ── FORMAT 8: UNREAD (클릭 후 미읽음) ── */
.unread-top-badge {
  position:absolute; top:68px; left:18px; z-index:10;
  display:inline-flex; align-items:center; gap:5px;
  font-size:11px; font-weight:700; letter-spacing:.04em; color:rgba(255,255,255,.85);
  background:rgba(255,255,255,.1); backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.16); padding:5px 13px; border-radius:20px;
}
.s-bottom-unread { position:absolute; bottom:0; left:0; right:0; z-index:10; padding:0 72px 36px 18px; }
.unread-title { font-size:18px; font-weight:700; color:#fff; line-height:1.42; letter-spacing:-.025em; margin-bottom:12px; }
.unread-prog-wrap { display:flex; align-items:center; gap:10px; margin-bottom:13px; }
.unread-prog-bar { flex:1; height:4px; background:rgba(255,255,255,.14); border-radius:2px; overflow:hidden; }
.unread-prog-fill { height:100%; background:var(--gold); border-radius:2px; }
.unread-prog-label { font-size:10.5px; font-weight:700; color:var(--gold); white-space:nowrap; flex-shrink:0; }
.continue-btn {
  width:100%; height:44px; background:#fff; border-radius:11px; border:none;
  cursor:pointer; font-size:13.5px; font-weight:700; color:#0A0A0A;
  font-family:inherit; display:flex; align-items:center; justify-content:center;
  gap:5px; letter-spacing:-.01em; transition:opacity .15s;
}
.continue-btn:active { opacity:.8; }

/* ── FIXED TOP BAR ── */
.fixed-top {
  position:absolute; top:0; left:0; right:0; z-index:100;
  padding:58px 20px 0; pointer-events:none;
}
.progress-bar { display:flex; gap:4px; margin-bottom:14px; }
.prog-seg {
  flex:1; height:2px; background:rgba(255,255,255,.18); border-radius:2px;
  overflow:hidden; transition:opacity .25s;
}
.prog-seg.p-active { opacity:1; }
.prog-seg:not(.p-active) { opacity:.28; }
.prog-fill { height:100%; background:#fff; border-radius:2px; width:0; }
.prog-seg.p-active .prog-fill { animation:fillProg 5s linear forwards; }
@keyframes fillProg { to { width:100%; } }
.top-nav { display:flex; align-items:center; justify-content:space-between; pointer-events:all; }
.logo { font-size:15px; font-weight:700; letter-spacing:.13em; color:#fff; text-transform:uppercase; }
.top-right { display:flex; align-items:center; gap:6px; }
.icon-btn {
  width:34px; height:34px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:rgba(255,255,255,.8); border-radius:50%; transition:background .15s;
}
.icon-btn:active { background:rgba(255,255,255,.1); }
.edit-btn {
  display:flex; align-items:center; gap:5px; height:30px; padding:0 10px;
  border-radius:8px; background:rgba(255,255,255,.09); backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.13); color:rgba(255,255,255,.75);
  font-size:11.5px; font-weight:600; cursor:pointer; letter-spacing:.01em;
  font-family:inherit; transition:all .15s;
}
.edit-btn.active { background:rgba(200,169,110,.18); border-color:rgba(200,169,110,.35); color:var(--gold); }

/* ── DRAWER ── */
.drawer-backdrop {
  position:absolute; inset:0; background:rgba(0,0,0,.45); z-index:110;
  opacity:0; pointer-events:none; transition:opacity .3s;
}
.drawer-backdrop.open { opacity:1; pointer-events:all; }
.edit-drawer {
  position:absolute; bottom:0; left:0; right:0; z-index:120;
  background:#161616; border-radius:22px 22px 0 0;
  border-top:1px solid rgba(255,255,255,.1);
  transform:translateY(100%); transition:transform .38s cubic-bezier(.4,0,.2,1);
  max-height:82%; display:flex; flex-direction:column;
}
.edit-drawer.open { transform:translateY(0); }
.drawer-handle { width:34px; height:4px; background:rgba(255,255,255,.18); border-radius:2px; margin:12px auto 0; flex-shrink:0; }
.drawer-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 18px 10px; flex-shrink:0; border-bottom:1px solid rgba(255,255,255,.06);
}
.drawer-title { font-size:14px; font-weight:700; color:rgba(255,255,255,.9); letter-spacing:-.01em; }
.drawer-head-r { display:flex; align-items:center; gap:6px; }
.btn-sm {
  height:28px; padding:0 10px; border-radius:7px; font-size:11.5px; font-weight:600;
  cursor:pointer; font-family:inherit; display:flex; align-items:center; gap:4px;
  background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1); color:rgba(255,255,255,.6);
}
.btn-close { width:28px; padding:0; border-radius:50%; justify-content:center; font-size:15px; }
.drawer-body { overflow-y:auto; padding:14px 18px 36px; flex:1; scrollbar-width:none; }
.drawer-body::-webkit-scrollbar { display:none; }
.form-group { margin-bottom:13px; }
.form-label { display:block; font-size:10px; font-weight:700; color:rgba(255,255,255,.32); letter-spacing:.1em; text-transform:uppercase; margin-bottom:7px; }
.form-input {
  width:100%; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09);
  border-radius:8px; padding:9px 11px; color:#fff; font-size:12.5px; font-family:inherit;
  outline:none; resize:none; transition:border-color .15s; line-height:1.5;
}
.form-input::placeholder { color:rgba(255,255,255,.2); }
.form-input:focus { border-color:rgba(200,169,110,.45); }
textarea.form-input { min-height:58px; }
.fmt-section-label { font-size:9px; font-weight:700; color:rgba(255,255,255,.22); letter-spacing:.12em; text-transform:uppercase; margin:10px 0 6px; }
.fmt-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:6px; }
.fmt-grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:6px; }
.fmt-opt {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:5px; padding:10px 6px; border-radius:10px;
  background:rgba(255,255,255,.05); border:1.5px solid rgba(255,255,255,.08);
  cursor:pointer; transition:all .15s; user-select:none;
}
.fmt-opt .fmt-icon { font-size:20px; }
.fmt-opt .fmt-name { font-size:10.5px; font-weight:700; color:rgba(255,255,255,.38); letter-spacing:.02em; text-align:center; line-height:1.3; }
.fmt-opt.active { background:rgba(200,169,110,.13); border-color:rgba(200,169,110,.35); }
.fmt-opt.active .fmt-name { color:var(--gold); }
.fmt-banner {
  display:flex; align-items:center; justify-content:center; gap:10px;
  padding:11px; border-radius:10px; cursor:pointer; transition:all .15s; user-select:none;
  background:rgba(200,169,110,.05); border:1.5px dashed rgba(200,169,110,.18);
  font-size:12px; font-weight:700; color:rgba(200,169,110,.4); letter-spacing:.02em;
}
.fmt-banner.active { background:rgba(200,169,110,.13); border-color:rgba(200,169,110,.4); color:var(--gold); }
.img-row { display:flex; gap:8px; align-items:center; }
.upload-zone {
  flex-shrink:0; width:60px; height:60px; border-radius:8px;
  background:rgba(255,255,255,.05); border:1.5px dashed rgba(255,255,255,.14);
  cursor:pointer; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:2px; position:relative; overflow:hidden;
}
.upload-zone:hover { border-color:rgba(200,169,110,.4); }
.upload-zone input { position:absolute; inset:0; opacity:0; cursor:pointer; }
.uz-ico { font-size:20px; }
.uz-txt { font-size:8.5px; color:rgba(255,255,255,.28); letter-spacing:.04em; }
.img-thumb { position:absolute; inset:0; background-size:cover; background-position:center; border-radius:7px; display:none; }
.color-swatches { display:flex; gap:7px; flex-wrap:wrap; }
.swatch {
  width:32px; height:32px; border-radius:8px; cursor:pointer;
  border:2px solid transparent; transition:border-color .15s; flex-shrink:0;
}
.swatch.sel { border-color:var(--gold); }
.swatch:active { transform:scale(.9); }
.badge-selector { display:flex; gap:5px; flex-wrap:wrap; }
.badge-opt {
  padding:4px 11px; border-radius:20px; font-size:10.5px; font-weight:700;
  cursor:pointer; border:1.5px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.05); color:rgba(255,255,255,.32);
  letter-spacing:.04em; transition:all .15s; user-select:none;
}
.badge-opt.sel-B,.badge-opt.sel-L { background:rgba(255,255,255,.1); color:#fff; border-color:rgba(255,255,255,.18); }
.badge-opt.sel-K,.badge-opt.sel-N { background:rgba(200,169,110,.13); color:var(--gold); border-color:rgba(200,169,110,.28); }
.badge-opt.sel-C { background:rgba(130,180,255,.1); color:#a8c8ff; border-color:rgba(130,180,255,.22); }
.row2 { display:flex; gap:8px; }
.row2 .form-group { flex:1; }
.divider { height:1px; background:rgba(255,255,255,.06); margin:12px 0; }
.delete-btn {
  width:100%; height:38px; margin-top:6px; border-radius:8px;
  background:rgba(255,50,50,.07); border:1px solid rgba(255,50,50,.14);
  color:rgba(255,90,90,.75); font-size:12px; font-weight:600;
  font-family:inherit; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:5px;
}
.delete-btn:active { background:rgba(255,50,50,.13); }
.home-bar {
  position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
  width:134px; height:5px; background:rgba(255,255,255,.22); border-radius:3px; z-index:400;
}

/* ── 실제 모바일 기기: 전체화면 모드 ── */
@media (max-width: 768px) {

let _isSaving = false, _saveTimer = null;

async function doSave(){
  if (!isAdmin) return;
  const payload = clips.map(c => ({...c, bg:(c.bg&&c.bg.startsWith('data:'))?'':(c.bg||'')}));
  if (db) {
    try {
      _isSaving = true;
      await db.collection('longblack').doc('clips').set({
        data: JSON.stringify(payload),
        ts: firebase.firestore.FieldValue.serverTimestamp()
      });
    } catch(e) { _isSaving = false; console.error(e); }
  } else {
    try { localStorage.setItem('lb_clips', JSON.stringify(clips)); } catch(e){}
  }
}
function saveNow(){ doSave(); }
function saveDebounced(){ clearTimeout(_saveTimer); _saveTimer = setTimeout(doSave, 700); }

  if (db) {
    db.collection('longblack').doc('clips').onSnapshot(snap => {
      if (_isSaving) { _isSaving = false; return; }
      const wrap = document.getElementById('scrollWrap');
      const prevScroll = wrap.scrollTop;
      if (!snap.exists) { renderAll(); setupMainObs(); if(isAdmin) doSave(); return; }
      try { clips = JSON.parse(snap.data().data); } catch(e) { return; }
      renderAll(); setupMainObs();
      requestAnimationFrame(() => { wrap.scrollTop = prevScroll; });
    }, err => {
      try { const s=localStorage.getItem('lb_clips'); if(s) clips=JSON.parse(s); } catch(e){}
      renderAll(); setupMainObs();
    });
  } else {
    try { const s=localStorage.getItem('lb_clips'); if(s) clips=JSON.parse(s); } catch(e){}
    renderAll(); setupMainObs();
  }
}

function resetData(){
  if (!isAdmin) return;
  if(!confirm('모든 클립을 기본값으로 초기화할까요?')) return;
  clips = JSON.parse(JSON.stringify(DEFAULT_CLIPS));
  doSave();
  if (!db) localStorage.removeItem('lb_clips');

}

function getSlideInner(c, clipIdx){
  switch(c.format){
    case 'quote':   return slideQuote(c,clipIdx);
    case 'card':    return slideCard(c,clipIdx);
    case 'stat':    return slideStat(c,clipIdx);
    case 'banner':  return slideBanner(c,clipIdx);
    case 'memory':  return slideMemory(c,clipIdx);
    case 'comment': return slideComment(c,clipIdx);
    case 'unread':  return slideUnread(c,clipIdx);
    default:        return slideImage(c,clipIdx);
  }
}

function renderAll(){
  const wrap=document.getElementById('scrollWrap');
  wrap.innerHTML=''; totalDom=0; buildProgress(); appendRound();
}
function appendRound(){
  const wrap=document.getElementById('scrollWrap');
  const start=totalDom;
  clips.forEach((c,clipIdx)=>{
    const div=document.createElement('div');
    div.className='clip-slide'; div.dataset.i=start+clipIdx;
    div.dataset.clip=clipIdx; div.dataset.format=c.format;
    div.innerHTML=getSlideInner(c,clipIdx);
    wrap.appendChild(div);
    if(mainObs) mainObs.observe(div);
  });
  totalDom=start+clips.length;
  setupAppendTrigger();
}
function rerenderClip(clipIdx){
  document.querySelectorAll(`.clip-slide[data-clip="${clipIdx}"]`).forEach(slide=>{
    const c=clips[clipIdx];
    slide.dataset.format=c.format;
    slide.innerHTML=getSlideInner(c,clipIdx);
    if(mainObs) mainObs.observe(slide);
  });
}
function buildProgress(){
  const pb=document.getElementById('progressBar');
  pb.innerHTML=clips.map((_,i)=>`<div class="prog-seg${i===curClipIdx?' p-active':''}"><div class="prog-fill"></div></div>`).join('');
}
function refreshProgress(){
  document.querySelectorAll('.prog-seg').forEach((seg,i)=>{
    seg.className='prog-seg'; void seg.offsetWidth;
    seg.className='prog-seg'+(i===curClipIdx?' p-active':'');
  });
}
function setupMainObs(){
  if(mainObs) mainObs.disconnect();
  mainObs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.intersectionRatio>=0.55){
        const ci=parseInt(e.target.dataset.clip);
        if(ci!==curClipIdx){ curClipIdx=ci; refreshProgress(); if(drawerOpen) fillDrawer(); }
      }
    });
  },{threshold:0.55});
  document.querySelectorAll('.clip-slide').forEach(s=>mainObs.observe(s));
}
function setupAppendTrigger(){
  if(appendObs) appendObs.disconnect();
  const trig=document.querySelector(`.clip-slide[data-i="${totalDom-2}"]`);
  if(!trig) return;
  appendObs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{ if(e.isIntersecting){ appendObs.disconnect(); appendRound(); }});
  },{threshold:0.4});
  appendObs.observe(trig);
}

function toggleDrawer(){
  drawerOpen=!drawerOpen;
  document.getElementById('editDrawer').classList.toggle('open',drawerOpen);
  document.getElementById('drawerBackdrop').classList.toggle('open',drawerOpen);

}

function fillDrawer(){
  const c=clips[curClipIdx]||{};
  const fmt=c.format||'image';
  // 포맷 버튼 활성화
  document.querySelectorAll('.fmt-opt').forEach(o=>o.classList.toggle('active',o.dataset.fmt===fmt));
  document.getElementById('fmtBanner').classList.toggle('active',fmt==='banner');
  updateDrawerFields(fmt);
  // 이미지 썸네일
  const thumb=document.getElementById('imgThumb');
  if(c.bg){ thumb.style.backgroundImage=`url('${c.bg}')`; thumb.style.display='block'; document.getElementById('imgUrlInput').value=c.bg.startsWith('data:')?'':c.bg; }
  else { thumb.style.backgroundImage=''; thumb.style.display='none'; document.getElementById('imgUrlInput').value=''; }
  // 스와치
  document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('sel',s.dataset.g===c.grad&&!c.bg));
  // 배지
  document.querySelectorAll('.badge-opt').forEach(o=>o.className='badge-opt'+(o.dataset.cls===c.cls?' sel-'+c.cls:''));
  // 텍스트 필드
  setVal('authorInput',c.author); setVal('titleInput',c.title); setVal('insightInput',c.insight);
  setVal('quoteInput',c.quote); setVal('subtitleInput',c.subtitle);
  setVal('statInput',c.stat); setVal('statUnitInput',c.statUnit); setVal('statCtxInput',c.statCtx);
  setVal('ratingInput',c.rating); setVal('noteUrlInput',c.url);
  // 개인화 필드
  setVal('memoryDateInput',c.memoryDate); setVal('commentInput',c.comment);
  setVal('commenterInput',c.commenter); setVal('commentLikesInput',c.commentLikes);
  setVal('readProgressInput',c.readProgress);
  // 폰트 크기
  const tsEl=document.getElementById('titleSizeInput'); if(tsEl) tsEl.value=c.titleSize||18;
}

function setVal(id,v){ const e=document.getElementById(id); if(e) e.value=v||''; }

function updateDrawerFields(fmt){
  const isBanner  = fmt==='banner';
  const isImage   = fmt==='image';
  const isCard    = fmt==='card';
  const isQuote   = fmt==='quote';
  const isStat    = fmt==='stat';
  const isMemory  = fmt==='memory';
  const isComment = fmt==='comment';
  const isUnread  = fmt==='unread';

  show('fg-bgimage',     isImage||isCard||isBanner||isMemory||isUnread||isComment);
  show('fg-bgcolor',     isQuote||isStat);
  show('fg-badge',       !isBanner&&!isComment);
  show('fg-author',      !isBanner&&!isComment);
  show('fg-title',       isImage||isCard||isBanner||isMemory||isComment||isUnread);
  show('fg-titlesize',   isImage||isCard||isBanner||isMemory||isUnread);
  show('fg-insight',     isImage||isStat||isMemory||isUnread);
  show('fg-quote',       isQuote);
  show('fg-subtitle',    isCard);
  show('fg-stat',        isStat);
  show('fg-rating',      isImage||isCard||isMemory);
  // 개인화 전용
  show('fg-memoryDate',  isMemory);
  show('fg-comment',     isComment);
  show('fg-commenter',   isComment);
  show('fg-commentLikes',isComment);
  show('fg-readProgress',isUnread);

  el('bgImageLbl').textContent  = isBanner ? '배너 이미지 (권장)' : isComment ? '배경 이미지 (선택)' : '배경 이미지';
  el('titleLbl').textContent    = isBanner ? '캡션 (선택)' : isComment ? '댓글 출처 노트 제목' : '제목';
  el('insightLbl').textContent  = isStat ? '설명 문장' : isMemory ? '기억을 떠올릴 문장' : isUnread ? '마저 읽어야 할 이유' : '핵심 인사이트';
  el('urlLbl').textContent      = isBanner ? '랜딩 URL' : '노트 URL';
}

function show(id,v){ const e=document.getElementById(id); if(e) e.style.display=v?'':'none'; }
function el(id){ return document.getElementById(id); }

function pickFormat(target){
  if(!isAdmin) return;
  const fmt=target.dataset.fmt;
  clips[curClipIdx].format=fmt;
  document.querySelectorAll('.fmt-opt').forEach(o=>o.classList.toggle('active',o===target));
  document.getElementById('fmtBanner').classList.toggle('active',fmt==='banner');
  updateDrawerFields(fmt); rerenderClip(curClipIdx); saveNow();
}

function liveText(field, val){
  if(!clips[curClipIdx]||!isAdmin) return;
  clips[curClipIdx][field]=val;
  document.querySelectorAll(`.clip-slide[data-clip="${curClipIdx}"] .live-${field}`).forEach(e=>{
    e.textContent=val;
    if(field==='author'){ const w=e.closest('.clip-author,.quote-attr'); if(w) w.style.display=val?'':'none'; }
    if(field==='insight'){ const w=e.closest('.clip-insight,.stat-desc'); if(w) w.style.display=val?'':'none'; }
    if(field==='commentLikes'){ const w=e.closest('.comment-likes-count'); if(w){ w.textContent=val?`❤️ ${val}명이 공감`:''; w.style.display=val?'':'none'; } }
  });
  saveDebounced();
}

function updateUrl(val){
  if(!clips[curClipIdx]||!isAdmin) return;
  clips[curClipIdx].url=val; saveDebounced();
}

function liveTitleSize(val){
  if(!clips[curClipIdx]||!isAdmin) return;
  clips[curClipIdx].titleSize=parseInt(val)||18;
  document.querySelectorAll(`.clip-slide[data-clip="${curClipIdx}"] .live-title`).forEach(e=>e.style.fontSize=val+'px');
  saveDebounced();

function liveProgress(val){
  if(!clips[curClipIdx]||!isAdmin) return;
  const p=Math.max(1,Math.min(99,parseInt(val)||23));
  clips[curClipIdx].readProgress=String(p);
  document.querySelectorAll(`.clip-slide[data-clip="${curClipIdx}"] .unread-prog-fill`).forEach(e=>e.style.width=p+'%');
  document.querySelectorAll(`.clip-slide[data-clip="${curClipIdx}"] .unread-prog-label`).forEach(e=>e.textContent=p+'% 읽음');
  saveDebounced();
}

async function onFileUpload(e){
  if(!isAdmin) return;
  const file=e.target.files[0]; if(!file) return;
  if(fbStorage){
    const thumb=el('imgThumb');
    thumb.style.display='block'; thumb.style.background='rgba(200,169,110,.08)'; thumb.style.backgroundImage='none';
    thumb.innerHTML='<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(200,169,110,.7);">업로드 중…</div>';
    try {
      const ref=fbStorage.ref(`clips/clip_${curClipIdx}_${Date.now()}`);
      await ref.put(file);
      const url=await ref.getDownloadURL();
      thumb.innerHTML=''; applyBg(url);
    } catch(err){ thumb.innerHTML=''; const r=new FileReader(); r.onload=ev=>applyBg(ev.target.result); r.readAsDataURL(file); }
  } else {
    const r=new FileReader(); r.onload=ev=>applyBg(ev.target.result); r.readAsDataURL(file);
  }
}
function onImgUrl(url){
  if(!isAdmin) return;
  if(!url){ clips[curClipIdx].bg=''; refreshBgAll(); el('imgThumb').style.display='none'; saveNow(); }
  else applyBg(url);
}
function applyBg(src){
  clips[curClipIdx].bg=src; refreshBgAll();
  const thumb=el('imgThumb');
  thumb.style.backgroundImage=`url('${src}')`; thumb.style.display='block';
  rerenderClip(curClipIdx); saveNow();
}
function refreshBgAll(){
  const c=clips[curClipIdx];
  document.querySelectorAll(`.clip-slide[data-clip="${curClipIdx}"] .clip-bg`).forEach(b=>{
    if(c.bg){ b.style.backgroundImage=`url('${c.bg}')`; b.style.background=''; }
    else { b.style.backgroundImage=''; b.style.background=c.grad; }
  });
}
function pickGrad(target){
  if(!isAdmin) return;
  clips[curClipIdx].bg=''; clips[curClipIdx].grad=target.dataset.g;
  document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('sel',s===target));
  el('imgThumb').style.display='none'; refreshBgAll(); rerenderClip(curClipIdx); saveNow();
}
function pickBadge(target){
  if(!isAdmin) return;
  clips[curClipIdx].badge=target.dataset.val; clips[curClipIdx].cls=target.dataset.cls;
  document.querySelectorAll('.badge-opt').forEach(o=>o.className='badge-opt'+(o===target?' sel-'+target.dataset.cls:''));
  document.querySelectorAll(`.clip-slide[data-clip="${curClipIdx}"] .s-badge`).forEach(b=>{
    b.textContent=clips[curClipIdx].badge; b.className=`badge s-badge badge-${clips[curClipIdx].cls}`;
  });
  saveNow();
}
function toggleLike(clipIdx){
  const c=clips[clipIdx]; c.liked=!c.liked; c.likes+=(c.liked?1:-1);
  document.querySelectorAll(`.clip-slide[data-clip="${clipIdx}"] .like-circle`).forEach(e=>e.style.background=c.liked?'rgba(200,50,50,.28)':'');
  document.querySelectorAll(`.clip-slide[data-clip="${clipIdx}"] .like-icon`).forEach(e=>{e.setAttribute('fill',c.liked?'#FF4444':'none');e.setAttribute('stroke',c.liked?'#FF4444':'white');});
  document.querySelectorAll(`.clip-slide[data-clip="${clipIdx}"] .like-count`).forEach(e=>e.textContent=fmtN(c.likes));
  const cur=document.querySelector(`.clip-slide[data-clip="${clipIdx}"][data-i="${curVisibleDomIdx()}"] .like-circle`);
  if(cur){cur.style.transform='scale(1.28)';setTimeout(()=>cur.style.transform='',220);}
}
function toggleSave(clipIdx){
  const c=clips[clipIdx]; c.saved=!c.saved;
  document.querySelectorAll(`.clip-slide[data-clip="${clipIdx}"] .save-circle`).forEach(e=>e.style.background=c.saved?'rgba(200,169,110,.2)':'');
  document.querySelectorAll(`.clip-slide[data-clip="${clipIdx}"] .save-icon`).forEach(e=>{e.setAttribute('fill',c.saved?'#C8A96E':'none');e.setAttribute('stroke',c.saved?'#C8A96E':'white');});
  const cur=document.querySelector(`.clip-slide[data-clip="${clipIdx}"][data-i="${curVisibleDomIdx()}"] .save-circle`);
  if(cur){cur.style.transform='scale(1.28)';setTimeout(()=>cur.style.transform='',220);}
}
function curVisibleDomIdx(){
  const wrap=document.getElementById('scrollWrap');
  return Math.round(wrap.scrollTop/wrap.clientHeight);
}
function openNote(clipIdx){
  const url=clips[clipIdx]?.url;
  if(url&&!url.endsWith('/')) window.open(url,'_blank');
}
function addClip(){
  if(!isAdmin) return;
  const idx=clips.length;
  clips.push({
    format:'image', bg:'', grad:GRADS[idx%GRADS.length], icon:ICONS[idx%ICONS.length],
    titleSize:18, badge:'브랜드', cls:'B', author:'저자 이름', title:'새 클립의 제목',
    insight:'핵심 인사이트를 입력하세요.', quote:'', subtitle:'',
    stat:'', statUnit:'', statCtx:'',
    memoryDate:'', comment:'', commenter:'', commentLikes:'', readProgress:'',
    rating:'4.0', likes:0, liked:false, saved:false, url:'https://longblack.co/note/'
  });
  curClipIdx=clips.length-1; saveNow(); renderAll(); setupMainObs();
  requestAnimationFrame(()=>{
    const t=document.querySelector(`.clip-slide[data-clip="${curClipIdx}"]`);
    if(t) t.scrollIntoView({behavior:'smooth'});
    if(drawerOpen) fillDrawer();
  });
}
function deleteClip(){
  if(!isAdmin) return;
  if(clips.length<=1){alert('클립은 최소 1개 필요해요.');return;}
  clips.splice(curClipIdx,1); curClipIdx=Math.min(curClipIdx,clips.length-1);
  saveNow(); renderAll(); setupMainObs(); if(drawerOpen) fillDrawer();
}

if(isAdmin) document.getElementById('editBtn').style.display='flex';
startSync();
</script>
</body>
</html>
